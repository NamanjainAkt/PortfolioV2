    <!-- Structured Data -->
    <script type="application/ld+json">

        "@context": "https://schema.org",

        "name": "Naman Jain",

    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root" style="background-color:#050505;min-height:100vh"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="text/javascript">
      (function() {
        function loadCal() {
          if (window.Cal) return;
          var s = document.createElement('script');
          s.src = 'https://app.cal.com/embed/embed.js';
          s.async = true;
          s.onload = function() {
            Cal('init', '30min', {origin:'https://app.cal.com'});
            Cal.ns['30min']('ui', {'hideEventTypeDetails':false,'layout':'month_view'});
          };
          document.head.appendChild(s);
        }
        function onCalTrigger() { loadCal(); document.removeEventListener('click', onCalTrigger); }
        document.addEventListener('click', function(e) {
          var t = e.target;
          if (t && t.closest && t.closest('[data-cal-link]')) { loadCal(); }
        });
        window.addEventListener('load', function() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(function(){
              if (document.querySelector('[data-cal-link]')) loadCal();
            }, { timeout: 5000 });
          }
        });
      })();
    </script>
  </body>
</html>
